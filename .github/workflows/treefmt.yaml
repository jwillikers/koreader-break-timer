name: Check files with treefmt
"on":
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - "**.json"
      - "**.just"
      - "**.lua"
      - "**.nix"
      - "**.toml"
      - "**.yaml"
      - "**.yml"
      - "**/.justfile"
      - "**/justfile"
      - .github/workflows/treefmt.yaml
      - flake.lock
      - stylua.toml

permissions:
  contents: read
  pull-requests: read

jobs:
  treefmt:
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - "**.json"
              - "**.just"
              - "**.lua"
              - "**.nix"
              - "**.toml"
              - "**.yaml"
              - "**.yml"
              - "**/.justfile"
              - "**/justfile"
              - .github/workflows/treefmt.yaml
              - flake.lock
              - stylua.toml
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.gate.outputs.run == 'true'
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main
        if: steps.gate.outputs.run == 'true'
      - name: Run treefmt
        if: steps.gate.outputs.run == 'true'
        run: nix develop --command treefmt --ci
      - uses: reviewdog/action-suggester@v1
        if: steps.gate.outputs.run == 'true'
        with:
          fail_on_error: true
          github_token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          tool_name: treefmt
