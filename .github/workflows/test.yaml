name: Test

"on":
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check:
    name: Nix flake check
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main
      # Runs the pre-commit hooks, including luacheck and treefmt, and the unit tests with LuaJIT and Lua 5.4.
      - name: Check
        run: nix flake check --print-build-logs
